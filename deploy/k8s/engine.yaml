apiVersion: v1
kind: Service
metadata: { name: engine, namespace: apexengine }
spec:
  selector: { app: engine }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: engine, namespace: apexengine }
spec:
  replicas: 1
  strategy:
    type: Recreate

  selector: { matchLabels: { app: engine } }
  template:
    metadata: { labels: { app: engine } }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: engine
          image: apexengine-backend:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: apex-config }
            - secretRef: { name: apex-secret }
          env: [{ name: ROLE, value: engine }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            httpGet: { path: /health/ready, port: 4000 }
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: 4000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 4000 }
            periodSeconds: 10
