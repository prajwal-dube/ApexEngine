# Optional: requires an installed NGINX Ingress Controller and local DNS/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apexengine
  namespace: apexengine
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
spec:
  ingressClassName: nginx
  rules:
    - host: apexengine.local
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 4000 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 4000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 8080 } } }
